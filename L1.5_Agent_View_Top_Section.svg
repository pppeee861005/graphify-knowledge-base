<!-- 深色背景 -->
<defs>
  <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
  </linearGradient>

  <filter id="nodeShadow">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
    <feOffset dx="0" dy="4" result="offsetblur"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.3"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="titleShadow">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
    <feOffset dx="0" dy="2" result="offsetblur"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.4"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- 背景矩形 -->
<rect width="900" height="160" fill="#0F172A"/>

<!-- 標題區域 -->
<text x="450" y="25" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF" filter="url(#titleShadow)" font-family="Arial, sans-serif">
  L1.5 Agent View 監控層
</text>

<!-- 副標題 -->
<text x="450" y="48" font-size="14" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif">
  多廚房監控台模式
</text>

<!-- 主節點：圓角矩形背景 -->
<rect x="350" y="70" width="200" height="60" rx="12" ry="12" fill="url(#nodeGradient)" filter="url(#nodeShadow)"/>

<!-- 節點文字：你（人類監控） -->
<text x="450" y="95" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">
  你（人類監控）
</text>

<!-- 節點下方標示文字 -->
<text x="450" y="135" font-size="12" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif">
  可見 3 個 session
</text>
