<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- ========== 定義區（整合自 Sub1） ========== -->
  <defs>
    <linearGradient id="chefGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- ========== 背景 ========== -->
  <rect width="800" height="600" fill="#0F172A"/>

  <!-- ========== 頂部區域（Sub1 回報） ========== -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">L1 Subagents 工作層</text>
  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">廚房型協作模式 — 主廚決策，幫手執行</text>

  <!-- 主廚節點 -->
  <rect x="300" y="80" width="200" height="60" rx="30" fill="url(#chefGradient)" filter="url(#shadow)"/>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FEF3C7">持有計畫</text>
  <text x="400" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Claude（主廚）</text>

  <!-- ========== 中間區域（Sub2 回報） ========== -->
  <!-- 向下箭頭 -->
  <line x1="320" y1="140" x2="200" y2="200" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <line x1="400" y1="140" x2="400" y2="200" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <line x1="480" y1="140" x2="600" y2="200" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>

  <!-- 指派標籤 -->
  <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F59E0B">指派任務</text>

  <!-- Sub Agent 節點 -->
  <rect x="120" y="210" width="160" height="70" rx="10" fill="url(#purpleGradient)" filter="url(#shadow)"/>
  <text x="200" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Sub 1</text>
  <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E0E7FF">🔪 切菜</text>

  <rect x="320" y="210" width="160" height="70" rx="10" fill="url(#purpleGradient)" filter="url(#shadow)"/>
  <text x="400" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Sub 2</text>
  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E0E7FF">🍳 炒鍋</text>

  <rect x="520" y="210" width="160" height="70" rx="10" fill="url(#purpleGradient)" filter="url(#shadow)"/>
  <text x="600" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Sub 3</text>
  <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E0E7FF">🧂 調味</text>

  <!-- ========== 底部區域（Sub3 回報） ========== -->
  <!-- 回報箭頭 -->
  <line x1="200" y1="280" x2="200" y2="340" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="400" y1="280" x2="400" y2="340" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="600" y1="280" x2="600" y2="340" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- 回報標籤 -->
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8B5CF6">回報結果</text>

  <!-- 結果匯總區 -->
  <rect x="100" y="350" width="600" height="70" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#60A5FA">📥 Claude Context Window</text>
  <text x="400" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">中間結果匯總 → 主廚決定下一步</text>

  <!-- 特徵說明區 -->
  <rect x="100" y="440" width="600" height="140" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

  <text x="130" y="470" font-family="Arial, sans-serif" font-size="13" fill="#F59E0B" font-weight="bold">核心特徵</text>

  <text x="130" y="500" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">• 單向指揮鏈：主廚 → 幫手 → 回報</text>
  <text x="130" y="522" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">• 逐回合決策：看到結果，決定下一步</text>
  <text x="130" y="544" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">• Token 效率：⭐⭐⭐⭐⭐ 最高</text>
  <text x="130" y="566" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">• 適用場景：複雜但短期的任務</text>

  <text x="480" y="500" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">• 可並行派出多個 subagent</text>
  <text x="480" y="522" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">• 結果存在主廚的 context</text>
  <text x="480" y="544" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">• 規模上限：10-20 個 subagent</text>
  <text x="480" y="566" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">• 需要人工干預：🤝 經常</text>

  <!-- 分隔線 -->
  <line x1="450" y1="485" x2="450" y2="575" stroke="#334155" stroke-width="1"/>
</svg>