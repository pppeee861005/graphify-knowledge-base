<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <!-- 漸層定義 -->
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="teamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
    <!-- 陰影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="500" fill="#0F172A"/>

  <!-- 標題區域 -->
  <text x="450" y="40" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Claude Agent 架構對比</text>

  <!-- 左側：L1 Subagents 區域 -->
  <rect x="30" y="60" width="400" height="420" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="230" y="95" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="14">L1 Subagents</text>
  <text x="230" y="118" text-anchor="middle" fill="#F59E0B" font-family="Arial, sans-serif" font-size="18" font-weight="bold">垂直階層架構</text>

  <!-- Claude 主節點 -->
  <rect x="155" y="145" width="150" height="50" rx="25" fill="url(#claudeGrad)" filter="url(#shadow)"/>
  <text x="230" y="177" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Claude</text>

  <!-- 垂直連接線 -->
  <line x1="180" y1="195" x2="105" y2="255" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="230" y1="195" x2="230" y2="255" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="280" y1="195" x2="355" y2="255" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- 箭頭 -->
  <polygon points="105,255 100,245 110,245" fill="#F59E0B"/>
  <polygon points="230,255 225,245 235,245" fill="#F59E0B"/>
  <polygon points="355,255 350,245 360,245" fill="#F59E0B"/>

  <!-- Sub Agent 節點 -->
  <rect x="55" y="260" width="100" height="45" rx="8" fill="url(#subGrad)" filter="url(#shadow)"/>
  <text x="105" y="288" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Sub 1</text>

  <rect x="180" y="260" width="100" height="45" rx="8" fill="url(#subGrad)" filter="url(#shadow)"/>
  <text x="230" y="288" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Sub 2</text>

  <rect x="305" y="260" width="100" height="45" rx="8" fill="url(#subGrad)" filter="url(#shadow)"/>
  <text x="355" y="288" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Sub 3</text>

  <!-- 回報箭頭 -->
  <line x1="105" y1="305" x2="105" y2="355" stroke="#8B5CF6" stroke-width="2"/>
  <polygon points="105,355 100,345 110,345" fill="#8B5CF6"/>

  <line x1="230" y1="305" x2="230" y2="355" stroke="#8B5CF6" stroke-width="2"/>
  <polygon points="230,355 225,345 235,345" fill="#8B5CF6"/>

  <line x1="355" y1="305" x2="355" y2="355" stroke="#8B5CF6" stroke-width="2"/>
  <polygon points="355,355 350,345 360,345" fill="#8B5CF6"/>

  <!-- 回報標籤 -->
  <rect x="55" y="360" width="100" height="35" rx="6" fill="#312E81" stroke="#6366F1" stroke-width="1"/>
  <text x="105" y="383" text-anchor="middle" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="12">回報結果</text>

  <rect x="180" y="360" width="100" height="35" rx="6" fill="#312E81" stroke="#6366F1" stroke-width="1"/>
  <text x="230" y="383" text-anchor="middle" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="12">回報結果</text>

  <rect x="305" y="360" width="100" height="35" rx="6" fill="#312E81" stroke="#6366F1" stroke-width="1"/>
  <text x="355" y="383" text-anchor="middle" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="12">回報結果</text>

  <!-- 左側特徵說明 -->
  <text x="230" y="430" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">• 單向指揮鏈</text>
  <text x="230" y="450" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">• 獨立執行，各自回報</text>
  <text x="230" y="470" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">• 適合明確分工的任務</text>

  <!-- 右側：L2 Agent Teams 區域 -->
  <rect x="470" y="60" width="400" height="420" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="670" y="95" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="14">L2 Agent Teams</text>
  <text x="670" y="118" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="18" font-weight="bold">橫向協作架構</text>

  <!-- Lead Agent 節點 -->
  <rect x="595" y="145" width="150" height="50" rx="25" fill="url(#leadGrad)" filter="url(#shadow)"/>
  <text x="670" y="177" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Lead Agent</text>

  <!-- 從 Lead 到 Team 的連接線 -->
  <line x1="620" y1="195" x2="545" y2="255" stroke="#10B981" stroke-width="2"/>
  <line x1="670" y1="195" x2="670" y2="255" stroke="#10B981" stroke-width="2"/>
  <line x1="720" y1="195" x2="795" y2="255" stroke="#10B981" stroke-width="2"/>

  <!-- Team Agent 節點 -->
  <rect x="495" y="260" width="100" height="45" rx="8" fill="url(#teamGrad)" filter="url(#shadow)"/>
  <text x="545" y="288" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">前端</text>

  <rect x="620" y="260" width="100" height="45" rx="8" fill="url(#teamGrad)" filter="url(#shadow)"/>
  <text x="670" y="288" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">後端</text>

  <rect x="745" y="260" width="100" height="45" rx="8" fill="url(#teamGrad)" filter="url(#shadow)"/>
  <text x="795" y="288" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">測試</text>

  <!-- 橫向雙向連接線 -->
  <line x1="595" y1="282" x2="620" y2="282" stroke="#38BDF8" stroke-width="3"/>
  <polygon points="595,282 605,277 605,287" fill="#38BDF8"/>
  <polygon points="620,282 610,277 610,287" fill="#38BDF8"/>

  <line x1="720" y1="282" x2="745" y2="282" stroke="#38BDF8" stroke-width="3"/>
  <polygon points="720,282 730,277 730,287" fill="#38BDF8"/>
  <polygon points="745,282 735,277 735,287" fill="#38BDF8"/>

  <!-- 共享任務清單區域 -->
  <rect x="520" y="340" width="300" height="60" rx="8" fill="#164E63" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="670" y="365" text-anchor="middle" fill="#22D3EE" font-family="Arial, sans-serif" font-size="13" font-weight="bold">📋 共享任務清單</text>
  <text x="670" y="385" text-anchor="middle" fill="#67E8F9" font-family="Arial, sans-serif" font-size="11">直接通訊 + 狀態同步 + 協作決策</text>

  <!-- 連接到共享清單的虛線 -->
  <line x1="545" y1="305" x2="545" y2="340" stroke="#22D3EE" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="670" y1="305" x2="670" y2="340" stroke="#22D3EE" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="795" y1="305" x2="795" y2="340" stroke="#22D3EE" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 右側特徵說明 -->
  <text x="670" y="430" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">• 雙向通訊協作</text>
  <text x="670" y="450" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">• 共享上下文與任務狀態</text>
  <text x="670" y="470" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">• 適合複雜系統開發</text>

  <!-- 中央分隔線 -->
  <line x1="450" y1="80" x2="450" y2="460" stroke="#475569" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- VS 標籤 -->
  <circle cx="450" cy="270" r="20" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <text x="450" y="276" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">VS</text>
</svg>