<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D 室內平面圖原型</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family:Arial, "Microsoft JhengHei", sans-serif; background:#111; }
  #app { position:fixed; inset:0; }
  #ui {
    position:fixed; top:14px; left:14px; z-index:10; padding:12px 14px;
    background:rgba(15,15,18,.82); color:#fff; border:1px solid rgba(255,255,255,.16);
    border-radius:12px; backdrop-filter:blur(8px); max-width:340px;
  }
  #ui h1 { font-size:16px; margin:0 0 8px; }
  #ui p { font-size:13px; line-height:1.5; margin:6px 0; color:#ddd; }
  button {
    border:0; border-radius:9px; padding:9px 12px; margin:4px 5px 4px 0;
    cursor:pointer; font-weight:700;
  }
  #mode { background:#f0b55a; color:#241708; }
  #reset { background:#e7e7e7; color:#111; }
  #planBtn { background:#74b7ff; color:#07182a; }
  #plan {
    position:fixed; right:14px; top:14px; z-index:9; width:min(34vw,420px);
    border-radius:12px; border:1px solid rgba(255,255,255,.2); display:none;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
  }
  #crosshair {
    position:fixed; left:50%; top:50%; width:12px; height:12px; margin:-6px 0 0 -6px;
    z-index:8; pointer-events:none; display:none;
  }
  #crosshair:before,#crosshair:after {content:"";position:absolute;background:#fff;opacity:.8}
  #crosshair:before {left:5px;top:0;width:2px;height:12px}
  #crosshair:after {left:0;top:5px;width:12px;height:2px}
  #badge {
    position:fixed; right:14px; bottom:14px; color:#ddd; background:rgba(0,0,0,.55);
    padding:8px 10px; border-radius:9px; font-size:12px;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <h1>室內 3D 原型</h1>
  <button id="mode">切換第一人稱</button>
  <button id="reset">重設視角</button>
  <button id="planBtn">顯示原始平面圖</button>
  <p><b>俯視模式：</b>滑鼠拖曳旋轉，滾輪縮放。</p>
  <p><b>第一人稱：</b>點擊畫面鎖定滑鼠，WASD 移動，Esc 解除。</p>
  <p>依上傳平面圖建立的概念驗證，格局與家具為近似重建。</p>
</div>

const floorMat = new THREE.MeshStandardMaterial({ color:0xe8dfd2, roughness:.88 });
const roomMat = new THREE.MeshStandardMaterial({ color:0xd4c1aa, roughness:.9 });
const wetMat = new THREE.MeshStandardMaterial({ color:0xd9b9b4, roughness:.86 });
const wallMat = new THREE.MeshStandardMaterial({ color:0xf4efe7, roughness:.92 });
const darkWallMat = new THREE.MeshStandardMaterial({ color:0x3e3b38, roughness:.8 });
const woodMat = new THREE.MeshStandardMaterial({ color:0x9a5b2e, roughness:.74 });
const fabricMat = new THREE.MeshStandardMaterial({ color:0x81766e, roughness:1 });
const whiteMat = new THREE.MeshStandardMaterial({ color:0xf2f0e9, roughness:.85 });
const blackMat = new THREE.MeshStandardMaterial({ color:0x222222, roughness:.55 });
const glassMat = new THREE.MeshStandardMaterial({ color:0x8cc8e8, transparent:true, opacity:.35, roughness:.15 });

function box(x,y,z,w,h,d,mat, cast=true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=true; scene.add(m); return m;
}
function floorRect(x,z,w,d,mat=floorMat) { return box(x,-.08,z,w,.16,d,mat,false); }
function wall(x,z,w,d,h=2.8,mat=wallMat) { return box(x,h/2,z,w,h,d,mat); }
function table(x,z,w,d) {
  box(x,.72,z,w,.12,d,woodMat);
  [[-.42,-.35],[.42,-.35],[-.42,.35],[.42,.35]].forEach(([dx,dz])=>box(x+dx*w,.36,z+dz*d,.08,.72,.08,woodMat));
}
function chair(x,z,rot=0) {
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(.48,.1,.48), woodMat); seat.position.y=.48;
  const back = new THREE.Mesh(new THREE.BoxGeometry(.48,.62,.09), woodMat); back.position.set(0,.78,.2);
  g.add(seat,back);
  [[-.19,-.19],[.19,-.19],[-.19,.19],[.19,.19]].forEach(([a,b])=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.06,.48,.06),woodMat);l.position.set(a,.24,b);g.add(l)})
  g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
}
function bed(x,z,rot=0) {
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(1.9,.35,2.4),woodMat); base.position.y=.25;
  const mattress=new THREE.Mesh(new THREE.BoxGeometry(1.75,.28,2.25),whiteMat); mattress.position.y=.55;
  const pillow=new THREE.Mesh(new THREE.BoxGeometry(1.2,.16,.42),whiteMat); pillow.position.set(0,.78,-.75);
  g.add(base,mattress,pillow); g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
}
function sofa(x,z,w=2.4,rot=0) {
  const g=new THREE.Group();
  const seat=new THREE.Mesh(new THREE.BoxGeometry(w,.45,.85),fabricMat); seat.position.y=.42;
  const back=new THREE.Mesh(new THREE.BoxGeometry(w,.85,.26),fabricMat); back.position.set(0,.8,.34);
  const a1=new THREE.Mesh(new THREE.BoxGeometry(.25,.65,.9),fabricMat); a1.position.set(-w/2,.56,0);
  const a2=a1.clone(); a2.position.x=w/2;
  g.add(seat,back,a1,a2); g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
}
function tv(x,z,rot=0) {
  const g=new THREE.Group();
  const s=new THREE.Mesh(new THREE.BoxGeometry(1.5,.85,.08),blackMat); s.position.y=1.2;
  const c=new THREE.Mesh(new THREE.BoxGeometry(1.8,.42,.42),woodMat); c.position.y=.22;
  g.add(s,c); g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
}

// Overall shell: approx. 10.72m x 10.8m
floorRect(0,0,10.72,10.8);
wall(0,-5.4,10.72,.18);
wall(0,5.4,10.72,.18);
wall(-5.36,0,.18,10.8);
wall(5.36,0,.18,10.8);

// Main partitions, based on visible plan proportions
wall(-3.35,-2.0,4.0,.14);
wall(-1.45,-3.65,.14,3.5);
wall(3.15,0,.15,10.6,darkWallMat);
wall(4.05,-1.15,1.8,.14);
wall(4.15,1.05,2.4,.14);
wall(4.15,-3.0,2.4,.14);
wall(4.15,3.0,2.4,.14);
wall(-3.25,2.35,4.1,.14);
wall(-1.15,3.85,.14,3.0);

// Color-zoned floors
floorRect(-3.35,-3.65,3.75,3.25,new THREE.MeshStandardMaterial({color:0xe9e6a3,roughness:.9}));
floorRect(-3.35,-.8,3.75,2.75,new THREE.MeshStandardMaterial({color:0xc99058,roughness:.9}));
floorRect(4.25,-3.95,2.0,2.8,roomMat);
floorRect(4.25,3.95,2.0,2.8,roomMat);
floorRect(4.15,0.0,1.9,3.9,wetMat);

// Doors as wood slabs
box(-1.42,.98,-2.55,.08,1.95,.9,woodMat);
box(3.15,.98,-2.2,.08,1.95,.9,woodMat);
box(3.15,.98,2.2,.08,1.95,.9,woodMat);
box(4.15,.98,-1.15,.9,1.95,.08,woodMat);
box(4.15,.98,1.05,.9,1.95,.08,woodMat);

// Windows
[[-4.3,-5.39,1.4,.08],[-2.25,-5.39,1.2,.08],[1.2,-5.39,1.5,.08],[4.25,-5.39,1.4,.08],
 [-3.85,5.39,1.25,.08],[-.9,5.39,1.45,.08],[2.0,5.39,1.3,.08],[4.2,5.39,1.2,.08]]
.forEach(([x,z,w,d])=>box(x,1.45,z,w,1.05,d,glassMat,false));

// Furniture
table(.0,-3.1,2.0,1.1);
chair(-1.25,-3.1,Math.PI/2); chair(1.25,-3.1,-Math.PI/2);
chair(-.55,-4.0,0); chair(.55,-4.0,0);
chair(-.55,-2.2,Math.PI); chair(.55,-2.2,Math.PI);

sofa(-.2,1.35,2.3,Math.PI/2);
sofa(-1.4,3.15,1.65,0);
table(-.2,2.9,1.2,.65);
tv(-4.55,2.4,Math.PI/2);

bed(4.25,-4.0,0);
bed(4.25,4.0,Math.PI);
tv(3.35,-4.0,Math.PI/2);
tv(3.35,4.0,Math.PI/2);

// kitchen counters
box(-4.75,.45,-3.45,.65,.9,2.7,whiteMat);
box(-3.2,.45,-5.0,2.2,.9,.6,whiteMat);
for(let i=0;i<4;i++) box(-4.72,.94,-4.35+i*.45,.18,.04,.18,blackMat,false);

// office
table(-3.45,-1.0,1.5,.65);
chair(-3.45,-.2,Math.PI);
box(-4.65,.65,-1.0,.55,1.3,1.5,woodMat);

// bathrooms
box(4.75,.35,-.1,.65,.7,.45,whiteMat);
box(4.75,.35,1.75,.65,.7,.45,whiteMat);
box(3.7,.45,.0,.45,.9,.75,whiteMat);
box(3.7,.45,1.9,.45,.9,.75,whiteMat);

// central pendant lights
for (const [x,z] of [[0,-3.1],[-.3,1.9],[-3.2,-3.8],[4.2,-4],[4.2,4]]) {
  const p = new THREE.PointLight(0xffd6a0, 20, 5, 2);
  p.position.set(x,2.45,z); p.castShadow=true; scene.add(p);
  box(x,2.55,z,.22,.14,.22,blackMat,false);
}

// subtle ceiling perimeter markers
const grid = new THREE.GridHelper(30,30,0x5f6b73,0x9aa7af);
grid.position.y=-.16; scene.add(grid);

document.addEventListener('keydown', e=>keys[e.code]=true);
document.addEventListener('keyup', e=>keys[e.code]=false);

function setMode(fpMode) {
  firstPerson = fpMode;
  orbit.enabled = !fpMode;
  document.getElementById('crosshair').style.display = fpMode ? 'block':'none';
  document.getElementById('mode').textContent = fpMode ? '切換俯視模式':'切換第一人稱';
  if(fpMode) {
    camera.position.set(0,1.65,4.2);
    camera.lookAt(0,1.65,0);
  } else {
    fp.unlock();
    camera.position.set(12,16,18);
    orbit.target.set(0,0,0);
    orbit.update();
  }
}
document.getElementById('mode').onclick=()=>setMode(!firstPerson);
document.getElementById('reset').onclick=()=>setMode(false);
document.getElementById('planBtn').onclick=()=>{
  const p=document.getElementById('plan');
  p.style.display=p.style.display==='block'?'none':'block';
};
renderer.domElement.addEventListener('click',()=>{ if(firstPerson && !fp.isLocked) fp.lock(); });

const clock=new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(firstPerson && fp.isLocked) {
    const speed=3.0;
    const dir=new THREE.Vector3();
    if(keys.KeyW) dir.z-=1;
    if(keys.KeyS) dir.z+=1;
    if(keys.KeyA) dir.x-=1;
    if(keys.KeyD) dir.x+=1;
    if(dir.lengthSq()>0) dir.normalize();
    fp.moveRight(dir.x*speed*dt);
    fp.moveForward(-dir.z*speed*dt);
    camera.position.y=1.65;
    camera.position.x=THREE.MathUtils.clamp(camera.position.x,-5.05,5.05);
    camera.position.z=THREE.MathUtils.clamp(camera.position.z,-5.05,5.05);
  }
  orbit.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
