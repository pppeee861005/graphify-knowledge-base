<h2 style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">互動儀表板:勾選五個關鍵訊號,觀察三種美伊局勢情境的機率如何更新</h2>
<div style="padding:0.5rem 0;">
<p style="font-size:13px;color:var(--color-text-secondary);margin:0 0 12px;">勾選=訊號在30天內觸發。機率為主觀先驗的貝氏更新示意,存檔日 2026-06-12。</p>
<div id="sigs" style="display:flex;flex-direction:column;gap:8px;margin:0 0 20px;">
<label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;"><input type="checkbox" data-i="0" onchange="upd()"><span style="flex:1;">十年期美債殖利率持續站上 5%</span><span style="font-size:12px;padding:2px 10px;border-radius:10px;background:#E1F5EE;color:#085041;">→和談</span><span style="font-size:12px;color:var(--color-text-tertiary);min-width:52px;text-align:right;">診斷力 中</span></label>
<label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;"><input type="checkbox" data-i="1" onchange="upd()"><span style="flex:1;">新停火文本明文涵蓋黎巴嫩</span><span style="font-size:12px;padding:2px 10px;border-radius:10px;background:#E1F5EE;color:#085041;">→和談</span><span style="font-size:12px;color:var(--color-text-tertiary);min-width:52px;text-align:right;">診斷力 高</span></label>
<label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;"><input type="checkbox" data-i="2" onchange="upd()"><span style="flex:1;">美財政部談判期間仍加碼制裁</span><span style="font-size:12px;padding:2px 10px;border-radius:10px;background:#F1EFE8;color:#444441;">→泥沼</span><span style="font-size:12px;color:var(--color-text-tertiary);min-width:52px;text-align:right;">診斷力 中</span></label>
<label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;"><input type="checkbox" data-i="3" onchange="upd()"><span style="flex:1;">以軍對黎巴嫩打擊頻率明顯上升</span><span style="font-size:12px;padding:2px 10px;border-radius:10px;background:#FAECE7;color:#712B13;">→升級</span><span style="font-size:12px;color:var(--color-text-tertiary);min-width:52px;text-align:right;">診斷力 高</span></label>
<label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;"><input type="checkbox" data-i="4" onchange="upd()"><span style="flex:1;">川普對以色列施壓升級為實質動作</span><span style="font-size:12px;padding:2px 10px;border-radius:10px;background:#E1F5EE;color:#085041;">→和談</span><span style="font-size:12px;color:var(--color-text-tertiary);min-width:52px;text-align:right;">診斷力 高</span></label>
</div>
<div style="display:flex;flex-direction:column;gap:14px;">
<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>泥沼延續(邊打邊談)</span><span id="p0" style="font-weight:500;">50%</span></div><div style="height:10px;background:var(--color-background-secondary);border-radius:5px;overflow:hidden;"><div id="b0" style="height:100%;width:50%;background:#888780;border-radius:5px;transition:width .4s;"></div></div></div>
<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>MOU 生效、海峽部分重開</span><span id="p1" style="font-weight:500;">30%</span></div><div style="height:10px;background:var(--color-background-secondary);border-radius:5px;overflow:hidden;"><div id="b1" style="height:100%;width:30%;background:#1D9E75;border-radius:5px;transition:width .4s;"></div></div></div>
<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>重大升級(領導層打擊、明牌政權更迭)</span><span id="p2" style="font-weight:500;">20%</span></div><div style="height:10px;background:var(--color-background-secondary);border-radius:5px;overflow:hidden;"><div id="b2" style="height:100%;width:20%;background:#D85A30;border-radius:5px;transition:width .4s;"></div></div></div>
</div>
<div style="display:flex;gap:12px;align-items:center;margin-top:18px;">
<button onclick="document.querySelectorAll('#sigs input').forEach(c=>c.checked=false);upd()">重設</button>
<button onclick="sendPrompt('解釋每個訊號的概似比是怎麼設定的')">概似比怎麼來的 ↗</button>
</div>
</div>
<script>
const LR=[[0.85,1.5,0.9],[0.5,2.6,0.4],[1.5,0.55,1.2],[0.9,0.4,2.2],[0.65,2.1,0.6]];
const PRIOR=[50,30,20];
function upd(){let p=PRIOR.slice();document.querySelectorAll('#sigs input').forEach(c=>{if(c.checked){const lr=LR[+c.dataset.i];p=p.map((v,k)=>v*lr[k]);}});const s=p[0]+p[1]+p[2];p=p.map(v=>Math.round(v/s*100));const d=100-(p[0]+p[1]+p[2]);p[0]+=d;for(let k=0;k<3;k++){document.getElementById('p'+k).textContent=p[k]+'%';document.getElementById('b'+k).style.width=p[k]+'%';}}
</script>
