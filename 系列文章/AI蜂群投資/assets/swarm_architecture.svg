<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="280" fill="#111"/>

  <!-- 指揮官 -->
  <circle cx="200" cy="40" r="25" fill="#f59e0b" stroke="#fcd34d" stroke-width="2"/>
  <text x="200" y="45" text-anchor="middle" fill="#000" font-weight="bold" font-size="11">指揮官</text>

  <!-- 戰術書 -->
  <rect x="140" y="90" width="120" height="35" rx="5" fill="#2563eb"/>
  <text x="200" y="112" text-anchor="middle" fill="#fff" font-size="11">戰術書.js</text>

  <!-- 連線 -->
  <line x1="200" y1="65" x2="200" y2="90" stroke="#f59e0b" stroke-width="2"/>

  <!-- 蜂群 -->
  <circle cx="80" cy="180" r="20" fill="#059669"/>
  <circle cx="160" cy="180" r="20" fill="#059669"/>
  <circle cx="240" cy="180" r="20" fill="#059669"/>
  <circle cx="320" cy="180" r="20" fill="#059669"/>
  <text x="80" y="184" text-anchor="middle" fill="#fff" font-size="9">A</text>
  <text x="160" y="184" text-anchor="middle" fill="#fff" font-size="9">B</text>
  <text x="240" y="184" text-anchor="middle" fill="#fff" font-size="9">C</text>
  <text x="320" y="184" text-anchor="middle" fill="#fff" font-size="9">D</text>

  <!-- 分發線 -->
  <line x1="160" y1="125" x2="80" y2="160" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3"/>
  <line x1="180" y1="125" x2="160" y2="160" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3"/>
  <line x1="220" y1="125" x2="240" y2="160" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3"/>
  <line x1="240" y1="125" x2="320" y2="160" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3"/>

  <!-- 警報 -->
  <rect x="120" y="230" width="160" height="25" rx="4" fill="#dc2626"/>
  <text x="200" y="247" text-anchor="middle" fill="#fff" font-size="10">異常 → 警報</text>

  <line x1="160" y1="200" x2="180" y2="230" stroke="#ef4444" stroke-width="1"/>
  <line x1="240" y1="200" x2="220" y2="230" stroke="#ef4444" stroke-width="1"/>
</svg>